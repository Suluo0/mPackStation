[package]
name = "mpack-launcher"
version = "0.1.0"
edition = "2021"
description = "mPackLauncher - Minecraft launcher core for mPackStation"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 错误处理
thiserror = "1"
anyhow = "1"

# 系统信息
sysinfo = "0.30"

# 文件锁
fs2 = "0.4"

# 异步运行时
tokio = { version = "1", features = ["full"] }

# Minecraft 启动器核心库
mc-launcher-core = "0.1.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
